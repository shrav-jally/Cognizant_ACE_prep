<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 UI Engineering Assignments (React & Angular Solutions)</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-sidebar: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-react: #38bdf8;
      --accent-angular: #f43f5e;
      --accent-primary: #6366f1;
      --border: #334155;
      --code-bg: #090d16;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Layout */
    sidebar {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .sidebar-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .nav-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    .nav-item {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.03); }
    .nav-item.active {
      background: var(--bg-card);
      border-left: 4px solid var(--accent-primary);
    }
    .nav-item .title {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .nav-item .num {
      font-size: 0.75rem;
      background: var(--border);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--text-muted);
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 30px;
    }
    .task-header {
      margin-bottom: 24px;
    }
    .task-header h2 {
      font-size: 1.8rem;
      color: #fff;
    }
    .task-header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .requirements-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .requirements-box h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .requirements-box ul {
      padding-left: 20px;
      color: var(--text-main);
    }
    .requirements-box li {
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    /* Code Tabs */
    .tabs-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.react.active {
      color: var(--accent-react);
      border-color: var(--accent-react);
    }
    .tab-btn.angular.active {
      color: var(--accent-angular);
      border-color: var(--accent-angular);
    }

    /* Code Container */
    .code-container {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre;
    }

    .code-block { display: none; }
    .code-block.active { display: block; }
  </style>
</head>
<body>

  <sidebar>
    <div class="sidebar-header">
      <h1>15 UI Engineering Tasks</h1>
      <p>Angular Signals vs React Hooks</p>
    </div>
    <ul class="nav-list" id="navList"></ul>
  </sidebar>

  <main>
    <div class="task-header">
      <h2 id="taskTitle">Task Title</h2>
      <p id="taskDesc">Task Description</p>
    </div>

    <div class="requirements-box">
      <h3>Design & Functional Requirements</h3>
      <ul id="reqList"></ul>
    </div>

    <div class="tabs-bar">
      <button class="tab-btn react active" onclick="switchTab('react')">React Solution</button>
      <button class="tab-btn angular" onclick="switchTab('angular')">Angular Solution</button>
    </div>

    <div id="reactCode" class="code-block active">
      <pre class="code-container"><code id="reactSource"></code></pre>
    </div>

    <div id="angularCode" class="code-block">
      <pre class="code-container"><code id="angularSource"></code></pre>
    </div>
  </main>

  <script>
    const assignments = [
      {
        id: 1,
        title: "5-Star Rating System",
        desc: "Interactive rating component supporting dynamic hover preview, selection state, and reset functionality.",
        reqs: [
          "Display 5 star icons with active/inactive highlighting",
          "Hovering over stars provides real-time hover rating feedback",
          "Clicking locks in the selected rating score",
          "Support an interactive 'Clear Rating' button"
        ],
        react: `import React, { useState } from 'react';

export function StarRating({ totalStars = 5, onRate }) {
  const [rating, setRating] = useState(0);
  const [hover, setHover] = useState(0);

  return (
    <div className="flex items-center gap-1">
      {[...Array(totalStars)].map((_, i) => {
        const starValue = i + 1;
        return (
          <button
            key={starValue}
            onClick={() => { setRating(starValue); onRate?.(starValue); }}
            onMouseEnter={() => setHover(starValue)}
            onMouseLeave={() => setHover(0)}
            style={{ color: starValue <= (hover || rating) ? '#f59e0b' : '#6b7280', fontSize: '24px' }}
          >
            ★
          </button>
        );
      })}
      <button onClick={() => setRating(0)} style={{ marginLeft: '12px' }}>Reset</button>
    </div>
  );
}`,
        angular: `import { Component, signal, output } from '@angular/core';

@Component({
  selector: 'app-star-rating',
  standalone: true,
  template: \`
    <div class="rating-container">
      @for (star of stars; track star) {
        <button
          [style.color]="star <= (hoverRating() || rating()) ? '#f59e0b' : '#6b7280'"
          (click)="setRating(star)"
          (mouseenter)="hoverRating.set(star)"
          (mouseleave)="hoverRating.set(0)">
          ★
        </button>
      }
      <button (click)="setRating(0)">Reset</button>
    </div>
  \`
})
export class StarRatingComponent {
  stars = [1, 2, 3, 4, 5];
  rating = signal(0);
  hoverRating = signal(0);
  rated = output<number>();

  setRating(val: number) {
    this.rating.set(val);
    this.rated.emit(val);
  }
}`
      },
      {
        id: 2,
        title: "Accordion / Collapsible FAQ",
        desc: "Vertical collapsible UI panel allowing users to toggle individual answers.",
        reqs: [
          "Clicking a question toggles its visibility",
          "Support single-expanded mode (opening one closes others)",
          "Smooth transition indicators for expanded vs collapsed states"
        ],
        react: `import React, { useState } from 'react';

export function Accordion({ items }) {
  const [openIndex, setOpenIndex] = useState(null);

  const toggle = (idx) => setOpenIndex(openIndex === idx ? null : idx);

  return (
    <div>
      {items.map((item, idx) => (
        <div key={idx} style={{ borderBottom: '1px solid #334155' }}>
          <button onClick={() => toggle(idx)} style={{ width: '100%', textAlign: 'left', padding: '12px' }}>
            {item.title} {openIndex === idx ? '▲' : '▼'}
          </button>
          {openIndex === idx && <div style={{ padding: '12px', background: '#1e293b' }}>{item.content}</div>}
        </div>
      ))}
    </div>
  );
}`,
        angular: `import { Component, signal, input } from '@angular/core';

@Component({
  selector: 'app-accordion',
  standalone: true,
  template: \`
    @for (item of items(); track $index) {
      <div class="item">
        <button (click)="toggle($index)">
          {{ item.title }} {{ openIndex() === $index ? '▲' : '▼' }}
        </button>
        @if (openIndex() === $index) {
          <div class="content">{{ item.content }}</div>
        }
      </div>
    }
  \`
})
export class AccordionComponent {
  items = input.required<{title: string, content: string}[]>();
  openIndex = signal<number | null>(null);

  toggle(idx: number) {
    this.openIndex.set(this.openIndex() === idx ? null : idx);
  }
}`
      },
      {
        id: 3,
        title: "Modal Dialog with Backdrop",
        desc: "Overlay dialog box with backdrop blur and escape key closure capabilities.",
        reqs: [
          "Dark backdrop overlay to dim background content",
          "Close via 'X' button, backdrop click, or Escape key",
          "Prevent body scroll when open"
        ],
        react: `import React, { useEffect } from 'react';

export function Modal({ isOpen, onClose, title, children }) {
  useEffect(() => {
    const handleKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [onClose]);

  if (!isOpen) return null;

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'grid', placeItems: 'center' }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: '#1e293b', padding: '24px', borderRadius: '8px' }}>
        <h3>{title}</h3>
        <div>{children}</div>
        <button onClick={onClose}>Close</button>
      </div>
    </div>
  );
}`,
        angular: `import { Component, input, output, HostListener } from '@angular/core';

@Component({
  selector: 'app-modal',
  standalone: true,
  template: \`
    @if (isOpen()) {
      <div class="overlay" (click)="close.emit()">
        <div class="modal-card" (click)="$event.stopPropagation()">
          <h3>{{ title() }}</h3>
          <ng-content></ng-content>
          <button (click)="close.emit()">Close</button>
        </div>
      </div>
    }
  \`
})
export class ModalComponent {
  isOpen = input<boolean>(false);
  title = input<string>('');
  close = output<void>();

  @HostListener('window:keydown.escape')
  onEscape() { if (this.isOpen()) this.close.emit(); }
}`
      },
      {
        id: 4,
        title: "Tabbed Navigation Panel",
        desc: "Switch between multiple content views dynamically without page reload.",
        reqs: [
          "Dynamic tab headers rendered from list data",
          "Active tab visual indicator",
          "Lazy rendering or conditional view switching"
        ],
        react: `import React, { useState } from 'react';

export function Tabs({ tabs }) {
  const [activeTab, setActiveTab] = useState(0);

  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', borderBottom: '1px solid #334155' }}>
        {tabs.map((tab, i) => (
          <button key={i} onClick={() => setActiveTab(i)} style={{ borderBottom: activeTab === i ? '2px solid #6366f1' : 'none' }}>
            {tab.label}
          </button>
        ))}
      </div>
      <div style={{ padding: '16px' }}>{tabs[activeTab]?.content}</div>
    </div>
  );
}`,
        angular: `import { Component, signal, input } from '@angular/core';

@Component({
  selector: 'app-tabs',
  standalone: true,
  template: \`
    <div class="tabs-header">
      @for (tab of tabs(); track $index) {
        <button [class.active]="activeIdx() === $index" (click)="activeIdx.set($index)">
          {{ tab.label }}
        </button>
      }
    </div>
    <div class="panel">{{ tabs()[activeIdx()].content }}</div>
  \`
})
export class TabsComponent {
  tabs = input.required<{label: string, content: string}[]>();
  activeIdx = signal(0);
}`
      },
      {
        id: 5,
        title: "Search Auto-complete Filter",
        desc: "Real-time query filtering over a dataset with highlight matching.",
        reqs: [
          "Debounced or instant query filtering",
          "Highlight matched search text inside results",
          "Clear input button and 'No results found' state"
        ],
        react: `import React, { useState } from 'react';

export function AutoComplete({ items }) {
  const [query, setQuery] = useState('');

  const filtered = items.filter(item => item.toLowerCase().includes(query.toLowerCase()));

  return (
    <div>
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search..." />
      {query && (
        <ul>
          {filtered.length ? filtered.map((item, i) => <li key={i}>{item}</li>) : <li>No results</li>}
        </ul>
      )}
    </div>
  );
}`,
        angular: `import { Component, signal, computed, input } from '@angular/core';
import { FormsModule } from '@angular/forms';

@Component({
  selector: 'app-autocomplete',
  standalone: true,
  imports: [FormsModule],
  template: \`
    <input [(ngModel)]="query" placeholder="Search..." />
    @if (query()) {
      <ul>
        @for (item of filtered(); track $index) {
          <li>{{ item }}</li>
        } @empty {
          <li>No results</li>
        }
      </ul>
    }
  \`
})
export class AutoCompleteComponent {
  items = input<string[]>([]);
  query = signal('');
  filtered = computed(() => this.items().filter(i => i.toLowerCase().includes(this.query().toLowerCase())));
}`
      },
      {
        id: 6,
        title: "Toast Notification Banner Queue",
        desc: "Trigger temporary notification banners that automatically vanish after a timer.",
        reqs: [
          "Support multiple types: Success, Error, Info",
          "Auto-dismiss toasts after 3 seconds",
          "Manual close button for instant dismiss"
        ],
        react: `import React, { useState } from 'react';

export function ToastQueue() {
  const [toasts, setToasts] = useState([]);

  const addToast = (msg, type = 'info') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
  };

  return (
    <div>
      <button onClick={() => addToast('Success message!', 'success')}>Show Toast</button>
      <div style={{ position: 'fixed', bottom: 20, right: 20 }}>
        {toasts.map(t => (
          <div key={t.id} style={{ padding: '10px 16px', background: '#334155', marginTop: '8px' }}>
            {t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}`,
        angular: `import { Component, signal } from '@angular/core';

@Component({
  selector: 'app-toast',
  standalone: true,
  template: \`
    <button (click)="add('Saved successfully!')">Show Toast</button>
    <div class="toast-wrapper">
      @for (t of toasts(); track t.id) {
        <div class="toast">{{ t.msg }}</div>
      }
    </div>
  \`
})
export class ToastComponent {
  toasts = signal<{id: number, msg: string}[]>([]);

  add(msg: string) {
    const id = Date.now();
    this.toasts.update(list => [...list, { id, msg }]);
    setTimeout(() => this.toasts.update(list => list.filter(t => t.id !== id)), 3000);
  }
}`
      },
      {
        id: 7,
        title: "Multi-step Form Wizard",
        desc: "Step-by-step form with step validation and step-progress indicators.",
        reqs: [
          "Next/Back step navigation",
          "Step indicator bar showing active & completed steps",
          "Final step review and submit action"
        ],
        react: `import React, { useState } from 'react';

export function MultiStepWizard() {
  const [step, setStep] = useState(1);
  const [formData, setFormData] = useState({ name: '', email: '' });

  return (
    <div>
      <h3>Step {step} of 2</h3>
      {step === 1 && (
        <input value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="Name" />
      )}
      {step === 2 && (
        <input value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} placeholder="Email" />
      )}
      <div style={{ marginTop: '12px' }}>
        {step > 1 && <button onClick={() => setStep(step - 1)}>Back</button>}
        {step < 2 ? <button onClick={() => setStep(step + 1)}>Next</button> : <button>Submit</button>}
      </div>
    </div>
  );
}`,
        angular: `import { Component, signal } from '@angular/core';
import { FormsModule } from '@angular/forms';

@Component({
  selector: 'app-wizard',
  standalone: true,
  imports: [FormsModule],
  template: \`
    <h3>Step {{ step() }} of 2</h3>
    @if (step() === 1) {
      <input [(ngModel)]="name" placeholder="Name" />
    } @else {
      <input [(ngModel)]="email" placeholder="Email" />
    }
    <div>
      @if (step() > 1) { <button (click)="step.set(1)">Back</button> }
      @if (step() === 1) { <button (click)="step.set(2)">Next</button> } @else { <button>Submit</button> }
    </div>
  \`
})
export class WizardComponent {
  step = signal(1);
  name = signal('');
  email = signal('');
}`
      },
      {
        id: 8,
        title: "Quantity Counter & Dynamic Pricing",
        desc: "Product quantity selector with increment, decrement, and live total price update.",
        reqs: [
          "Increment & Decrement buttons with min limit of 1",
          "Manual input validation (disallow negative numbers)",
          "Live price multiplication output"
        ],
        react: `import React, { useState } from 'react';

export function QuantityCounter({ unitPrice = 25 }) {
  const [qty, setQty] = useState(1);

  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
        <button onClick={() => setQty(Math.max(1, qty - 1))}>-</button>
        <span>{qty}</span>
        <button onClick={() => setQty(qty + 1)}>+</button>
      </div>
      <p style={{ marginTop: '8px' }}>Total Price: \${qty * unitPrice}</p>
    </div>
  );
}`,
        angular: `import { Component, signal, computed, input } from '@angular/core';

@Component({
  selector: 'app-counter',
  standalone: true,
  template: \`
    <button (click)="update(-1)">-</button>
    <span>{{ qty() }}</span>
    <button (click)="update(1)">+</button>
    <p>Total: \${{ total() }}</p>
  \`
})
export class CounterComponent {
  unitPrice = input(25);
  qty = signal(1);
  total = computed(() => this.qty() * this.unitPrice());

  update(val: number) {
    this.qty.update(q => Math.max(1, q + val));
  }
}`
      },
      {
        id: 9,
        title: "Image Carousel Slider",
        desc: "Image showcase component with prev/next controls and indicator dots.",
        reqs: [
          "Previous and Next slide navigation buttons",
          "Pagination dots indicating current active slide index",
          "Cyclic sliding (last slide wraps back to first)"
        ],
        react: `import React, { useState } from 'react';

export function Carousel({ images = ['#1e293b', '#334155', '#475569'] }) {
  const [idx, setIdx] = useState(0);

  const prev = () => setIdx((idx - 1 + images.length) % images.length);
  const next = () => setIdx((idx + 1) % images.length);

  return (
    <div>
      <div style={{ width: 300, height: 180, background: images[idx], display: 'grid', placeItems: 'center' }}>
        Slide {idx + 1}
      </div>
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button onClick={prev}>Prev</button>
        <button onClick={next}>Next</button>
      </div>
    </div>
  );
}`,
        angular: `import { Component, signal, input } from '@angular/core';

@Component({
  selector: 'app-carousel',
  standalone: true,
  template: \`
    <div [style.background]="slides()[idx()]" class="slide-box">
      Slide {{ idx() + 1 }}
    </div>
    <button (click)="prev()">Prev</button>
    <button (click)="next()">Next</button>
  \`
})
export class CarouselComponent {
  slides = input(['#1e293b', '#334155', '#475569']);
  idx = signal(0);

  prev() { this.idx.update(i => (i - 1 + this.slides().length) % this.slides().length); }
  next() { this.idx.update(i => (i + 1) % this.slides().length); }
}`
      },
      {
        id: 10,
        title: "Nested Comment & Reply System",
        desc: "Threaded comment system supporting reply submissions.",
        reqs: [
          "Render nested list of comments and replies",
          "Toggleable reply input box for each comment",
          "Dynamic comment addition"
        ],
        react: `import React, { useState } from 'react';

export function CommentThread() {
  const [comments, setComments] = useState([{ id: 1, text: 'Great post!', replies: [] }]);
  const [text, setText] = useState('');

  const addComment = () => {
    if (!text) return;
    setComments([...comments, { id: Date.now(), text, replies: [] }]);
    setText('');
  };

  return (
    <div>
      <input value={text} onChange={e => setText(e.target.value)} placeholder="Add comment..." />
      <button onClick={addComment}>Post</button>
      {comments.map(c => <div key={c.id} style={{ padding: '8px 0' }}>• {c.text}</div>)}
    </div>
  );
}`,
        angular: `import { Component, signal } from '@angular/core';
import { FormsModule } from '@angular/forms';

@Component({
  selector: 'app-comments',
  standalone: true,
  imports: [FormsModule],
  template: \`
    <input [(ngModel)]="newText" placeholder="Add comment..." />
    <button (click)="add()">Post</button>
    @for (c of comments(); track c.id) {
      <div class="comment">• {{ c.text }}</div>
    }
  \`
})
export class CommentsComponent {
  comments = signal<{id: number, text: string}[]>([{ id: 1, text: 'Great post!' }]);
  newText = signal('');

  add() {
    if (!this.newText()) return;
    this.comments.update(list => [...list, { id: Date.now(), text: this.newText() }]);
    this.newText.set('');
  }
}`
      },
      {
        id: 11,
        title: "Dark / Light Mode Theme Switcher",
        desc: "Toggle application global theme variables.",
        reqs: [
          "Toggle state for Dark / Light theme",
          "Persist selection in state",
          "Smooth CSS color transition"
        ],
        react: `import React, { useState } from 'react';

export function ThemeToggle() {
  const [isDark, setIsDark] = useState(true);

  return (
    <div style={{ background: isDark ? '#0f172a' : '#ffffff', color: isDark ? '#fff' : '#000', padding: 20 }}>
      <button onClick={() => setIsDark(!isDark)}>
        Switch to {isDark ? 'Light' : 'Dark'} Mode
      </button>
    </div>
  );
}`,
        angular: `import { Component, signal } from '@angular/core';

@Component({
  selector: 'app-theme',

export function TagInput() {
  const [tags, setTags] = useState(['React', 'Angular']);
  const [input, setInput] = useState('');

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && input.trim()) {
      if (!tags.includes(input.trim())) setTags([...tags, input.trim()]);
      setInput('');
    }
  };

  return (
    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', border: '1px solid #334155', padding: 8 }}>
      {tags.map((t, i) => (
        <span key={i} style={{ background: '#334155', padding: '2px 8px', borderRadius: 12 }}>
          {t} <button onClick={() => setTags(tags.filter((_, idx) => idx !== i))}>×</button>
        </span>
      ))}
      <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown} placeholder="Add tag..." />
    </div>
  );
}`,
        angular: `import { Component, signal } from '@angular/core';
import { FormsModule } from '@angular/forms';

@Component({
  selector: 'app-tags',
  standalone: true,
  imports: [FormsModule],
  template: \`
    <div class="tag-box">
      @for (tag of tags(); track $index) {
        <span class="pill">{{ tag }} <button (click)="remove($index)">×</button></span>
      }
      <input [(ngModel)]="text" (keydown.enter)="add()" placeholder="Add tag..." />
    </div>
  \`
})
export class TagsComponent {
  tags = signal(['React', 'Angular']);
  text = signal('');

  add() {
    const val = this.text().trim();
    if (val && !this.tags().includes(val)) {
      this.tags.update(t => [...t, val]);
      this.text.set('');
    }
  }

  remove(idx: number) {
    this.tags.update(t => t.filter((_, i) => i !== idx));
  }
}`

    let activeTaskId = 1;
    let activeTab = 'react';

    function init() {
      const navList = document.getElementById('navList');
      navList.innerHTML = assignments.map(a => `
        <li class="nav-item ${a.id === activeTaskId ? 'active' : ''}" onclick="selectTask(${a.id})">
          <span class="title">${a.title}</span>
          <span class="num">#${a.id}</span>
        </li>
      `).join('');

      renderTask();
    }

    function selectTask(id) {
      activeTaskId = id;
      init();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.classList.contains(tab));
      });
      document.getElementById('reactCode').classList.toggle('active', tab === 'react');
      document.getElementById('angularCode').classList.toggle('active', tab === 'angular');
    }

    function renderTask() {
      const task = assignments.find(a => a.id === activeTaskId);
      document.getElementById('taskTitle').innerText = `#${task.id} - ${task.title}`;
      document.getElementById('taskDesc').innerText = task.desc;
      document.getElementById('reqList').innerHTML = task.reqs.map(r => `<li>${r}</li>`).join('');
      document.getElementById('reactSource').innerText = task.react;
      document.getElementById('angularSource').innerText = task.angular;
    }

    init();
  </script>
